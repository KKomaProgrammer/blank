name: pdfjs-vendor-temp
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Download pdfjs-dist
        run: |
          set -euxo pipefail
          npm pack pdfjs-dist@4.10.38
          mkdir -p vendor
          tar -xzf pdfjs-dist-4.10.38.tgz -C vendor
      - name: Prepare local bundle
        run: |
          set -euxo pipefail
          mkdir -p out/pdfjs
          cp vendor/package/build/pdf.min.mjs out/pdfjs/
          cp vendor/package/build/pdf.worker.min.mjs out/pdfjs/
          cp -R vendor/package/cmaps out/pdfjs/
          cp -R vendor/package/standard_fonts out/pdfjs/
          if [ -d vendor/package/wasm ]; then cp -R vendor/package/wasm out/pdfjs/; fi
          printf '%s\n' 'pdfjs-dist 4.10.38 - Apache-2.0' > out/pdfjs/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdfjs-vendor-4.10.38
          path: out/pdfjs
          if-no-files-found: error
          retention-days: 1
